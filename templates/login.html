<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Autentificare - Biblioteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;

            width: 350px;
            max-width: 90%;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;

            padding: 11px;

            margin-top: 6px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 25px;

            cursor: pointer;
        }

        .error {
            color: #b00020;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Biblioteca</h2>

    <p>Autentificare utilizator</p>

    {% with mesaje = get_flashed_messages() %}

        {% if mesaje %}

            {% for mesaj in mesaje %}

                <p class="error">
                    {{ mesaj }}
                </p>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form action="/login" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required>

        <label for="parola">Parola</label>

        <input
            type="password"
            id="parola"
            name="parola"
            autocomplete="current-password"
            required>

        <button type="submit">
            Autentificare
        </button>

    </form>

</div>

</body>
</html>
